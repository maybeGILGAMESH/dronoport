# Ограниченная модель: аппарат навсегда закреплён за одним коридором и делает
# 4 оборотных рейса за сутки. Пересадки разрешены по временным путям.
# На порт приходится не более 2 закреплённых аппаратов всех инцидентных коридоров.
# Рассматриваются 3 кратчайших пространственных пути на OD и допустимые времена старта.
# Граница MIP относится только к этой модели, а не к произвольным маршрутам флота.
# Годовой фиксированный OPEX включает персонал/обслуживание/ремонт/содержание,
# но не энергию; энергия считается отдельно по всем рейсам, включая порожние.
